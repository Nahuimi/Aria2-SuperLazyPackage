name: Package latest aria2-next and AriaNg

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve latest upstream releases
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/AnInsomniacy/aria2-next/releases/latest > aria2-next-release.json
          gh api repos/mayswind/AriaNg/releases/latest > ariang-release.json

          aria2_tag="$(jq -er '.tag_name' aria2-next-release.json)"
          ariang_tag="$(jq -er '.tag_name' ariang-release.json)"
          aria2_version="${aria2_tag#v}"
          ariang_version="${ariang_tag#v}"
          aria2_url="$(jq -er '[.assets[] | select(.name | test("windows-x86_64\\.exe$"))] | if length == 1 then .[0].browser_download_url else error("Expected one Windows x86_64 asset") end' aria2-next-release.json)"
          checksum_url="$(jq -er '[.assets[] | select(.name | test("checksums\\.sha256$"))] | if length == 1 then .[0].browser_download_url else error("Expected one checksum asset") end' aria2-next-release.json)"
          ariang_url="$(jq -er '[.assets[] | select(.name | test("AllInOne\\.zip$"))] | if length == 1 then .[0].browser_download_url else error("Expected one AllInOne asset") end' ariang-release.json)"

          {
            echo "aria2_tag=$aria2_tag"
            echo "aria2_version=$aria2_version"
            echo "ariang_tag=$ariang_tag"
            echo "ariang_version=$ariang_version"
            echo "aria2_url=$aria2_url"
            echo "checksum_url=$checksum_url"
            echo "ariang_url=$ariang_url"
          } >> "$GITHUB_OUTPUT"

      - name: Determine package release version
        id: release
        shell: bash
        env:
          ARIA2_TAG: ${{ steps.upstream.outputs.aria2_tag }}
          ARIA2_VERSION: ${{ steps.upstream.outputs.aria2_version }}
          ARIANG_TAG: ${{ steps.upstream.outputs.ariang_tag }}
          ARIANG_VERSION: ${{ steps.upstream.outputs.ariang_version }}
        run: |
          set -euo pipefail

          marker="<!-- upstream:aria2-next=${ARIA2_TAG};AriaNg=${ARIANG_TAG} -->"
          legacy_tag="aria2-next-${ARIA2_VERSION}_AriaNg-${ARIANG_VERSION}"

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-pages.json
          jq '[.[][]]' release-pages.json > releases.json

          current_release_id="$(jq -r --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))][0].id // empty' releases.json)"
          if [[ -n "$current_release_id" ]]; then
            current_tag="$(jq -r --argjson id "$current_release_id" '.[] | select(.id == $id) | .tag_name' releases.json)"
            {
              echo "needs_release=false"
              echo "migrate=false"
              echo "release_tag=$current_tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_version="$(jq -r '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name[1:] | split(".") | map(tonumber)] | sort | last // empty | join(".")' releases.json)"
          legacy_release_id="$(jq -r --arg tag "$legacy_tag" '[.[] | select(.tag_name == $tag)][0].id // empty' releases.json)"

          if [[ -z "$latest_version" ]]; then
            release_tag="v0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest_version"
            release_tag="v${major}.${minor}.$((patch + 1))"
          fi

          if [[ -n "$legacy_release_id" && -z "$latest_version" ]]; then
            migrate=true
          else
            migrate=false
          fi

          {
            echo "needs_release=true"
            echo "migrate=$migrate"
            echo "legacy_tag=$legacy_tag"
            echo "release_id=$legacy_release_id"
            echo "release_tag=$release_tag"
            echo "package_name=Aria2-SuperLazyPackage_${release_tag}.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.release.outputs.needs_release == 'true' && steps.release.outputs.migrate == 'false'
        shell: bash
        env:
          ARIA2_URL: ${{ steps.upstream.outputs.aria2_url }}
          CHECKSUM_URL: ${{ steps.upstream.outputs.checksum_url }}
          ARIANG_URL: ${{ steps.upstream.outputs.ariang_url }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        run: |
          set -euo pipefail

          mkdir -p build/Aria2/AriaNg downloads

          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|aria2c.exe) continue ;;
            esac
            mkdir -p "build/Aria2/$(dirname "$file")"
            cp "$file" "build/Aria2/$file"
          done < <(git ls-files -z)

          curl --fail --location --retry 3 "$ARIA2_URL" --output downloads/aria2c.exe
          curl --fail --location --retry 3 "$CHECKSUM_URL" --output downloads/checksums.sha256
          aria2_asset_name="$(basename "${ARIA2_URL%%\?*}")"
          expected_hash="$(awk -v name="$aria2_asset_name" '$2 == name { print $1 }' downloads/checksums.sha256)"
          test -n "$expected_hash"
          echo "$expected_hash  downloads/aria2c.exe" | sha256sum --check --strict
          cp downloads/aria2c.exe build/Aria2/aria2c.exe

          curl --fail --location --retry 3 "$ARIANG_URL" --output downloads/AriaNg-AllInOne.zip
          unzip -q downloads/AriaNg-AllInOne.zip -d build/Aria2/AriaNg

          (cd build && zip -9 -r "../$PACKAGE_NAME" Aria2)

      - name: Write release notes
        if: steps.release.outputs.needs_release == 'true'
        shell: bash
        env:
          ARIA2_TAG: ${{ steps.upstream.outputs.aria2_tag }}
          ARIANG_TAG: ${{ steps.upstream.outputs.ariang_tag }}
        run: |
          cat > release-notes.md <<EOF
          ## 内含版本

          - [aria2-next ${ARIA2_TAG}](https://github.com/AnInsomniacy/aria2-next/releases/tag/${ARIA2_TAG})（Windows x86_64）
          - [AriaNg ${ARIANG_TAG}](https://github.com/mayswind/AriaNg/releases/tag/${ARIANG_TAG})（AllInOne）

          此安装包由 GitHub Actions 自动获取上游最新稳定版并打包。

          <!-- upstream:aria2-next=${ARIA2_TAG};AriaNg=${ARIANG_TAG} -->
          EOF

      - name: Migrate legacy release to v0.0.1
        if: steps.release.outputs.needs_release == 'true' && steps.release.outputs.migrate == 'true'
        shell: bash
        env:
          LEGACY_TAG: ${{ steps.release.outputs.legacy_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        run: |
          set -euo pipefail

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "$RELEASE_TAG" \
            --rawfile body release-notes.md \
            '{tag_name: $tag, name: $name, body: $body}' > update-release.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input update-release.json > migrated-release.json

          asset_id="$(jq -er '[.assets[] | select(.name | endswith(".zip"))] | if length == 1 then .[0].id else error("Expected one ZIP asset") end' migrated-release.json)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -f name="$PACKAGE_NAME" >/dev/null

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$LEGACY_TAG"

      - name: Create GitHub release
        if: steps.release.outputs.needs_release == 'true' && steps.release.outputs.migrate == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        run: |
          gh release create "$RELEASE_TAG" "$PACKAGE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Remove legacy releases
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r '.[][] | select(.tag_name | test("^aria2-next-.*_AriaNg-.*$")) | [.id, .tag_name] | @tsv' \
            > legacy-releases.tsv

          while IFS=$'\t' read -r release_id legacy_tag; do
            [[ -n "$release_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$legacy_tag" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$legacy_tag"
            fi
          done < legacy-releases.tsv
